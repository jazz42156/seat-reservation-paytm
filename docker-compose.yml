services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: seat
      POSTGRES_PASSWORD: seat
      POSTGRES_DB: seat
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seat -d seat"]
      interval: 2s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      DATABASE_URL: postgresql://seat:seat@db:5432/seat
      AUTH_SECRET: dev-auth-secret
      ADMIN_TOKEN: dev-admin-token
    depends_on:
      db:
        condition: service_healthy
